name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Linter
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
